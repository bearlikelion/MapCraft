name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - patchnotes/**
      - docs/**
      - godot/README.md
      # The shortcut tables are generated from these.
      - crates/ui/src/shortcuts.rs
      - crates/ui/src/dialogs.rs
      - crates/engine/src/commands.rs
      - .github/workflows/pages.yml
  # A release rebuilds the site from main so the changelog dates it by its tag.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog dates each release by its tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site/gen
      - name: Build the site
        run: cargo run --manifest-path site/gen/Cargo.toml --release
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site
      - id: deployment
        uses: actions/deploy-pages@v5
