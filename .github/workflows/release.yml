name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    # The oldest supported runner keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: appimagetool
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - run: packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/MapCraft-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: packaging/windows-zip.sh x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MapCraft-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MAPCRAFT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - run: packaging/macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/MapCraft-macos.zip

  # The macOS library has to be built on a Mac; the addon job below packs it with the others.
  godot-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja
      - name: Build the extension
        run: |
          godot/build.sh macos template_debug
          godot/build.sh macos template_release
      - uses: actions/upload-artifact@v4
        with:
          name: godot-macos
          path: godot/addons/mapcraft/bin/macos

  godot-addon:
    needs: [godot-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: godot-macos
          path: godot/addons/mapcraft/bin/macos
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build mingw-w64
      - name: Build the extension
        run: |
          for target in template_debug template_release; do
            godot/build.sh linux "$target"
            godot/build.sh windows "$target"
          done
      - run: packaging/godot-addon.sh
      - uses: actions/upload-artifact@v4
        with:
          name: godot-addon
          path: dist/MapCraft-godot-addon.zip

  release:
    needs: [appimage, windows, macos, godot-addon]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{appimage,windows,macos,godot-addon}'
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MapCraft $GITHUB_REF_NAME" --generate-notes
