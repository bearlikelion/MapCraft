name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux builds run on the build server inside Ubuntu 22.04, which keeps the glibc requirement low.
  appimage:
    runs-on: [self-hosted, build]
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MAPCRAFT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - run: packaging/linux-container.sh packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/MapCraft-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MAPCRAFT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - run: packaging/windows-zip.sh x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MapCraft-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MAPCRAFT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - run: packaging/macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/MapCraft-macos.zip

  # The macOS library has to be built on a Mac; ccache keeps godot-cpp from compiling from scratch each release.
  godot-macos:
    strategy:
      matrix:
        target: [template_debug, template_release]
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja ccache
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../ccache
          key: godot-macos-${{ matrix.target }}-${{ github.sha }}
          restore-keys: godot-macos-${{ matrix.target }}-
      - run: godot/build.sh macos ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: godot-macos-${{ matrix.target }}
          path: godot/addons/mapcraft/bin/macos

  godot-linux:
    runs-on: [self-hosted, build]
    steps:
      - uses: actions/checkout@v4
      - run: packaging/linux-container.sh bash -c 'godot/build.sh linux template_debug && godot/build.sh linux template_release'
      - uses: actions/upload-artifact@v4
        with:
          name: godot-linux
          path: godot/addons/mapcraft/bin/linux

  # Windows libraries cross-compile with MinGW and need no particular glibc.
  godot-windows:
    runs-on: [self-hosted, build]
    env:
      CCACHE_DIR: /build/ci-cache/ccache-windows
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      - run: godot/build.sh windows template_debug && godot/build.sh windows template_release
      - uses: actions/upload-artifact@v4
        with:
          name: godot-windows
          path: godot/addons/mapcraft/bin/windows

  godot-addon:
    needs: [godot-macos, godot-linux, godot-windows]
    runs-on: [self-hosted, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godot-macos-*
          path: godot/addons/mapcraft/bin/macos
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: godot-linux
          path: godot/addons/mapcraft/bin/linux
      - uses: actions/download-artifact@v4
        with:
          name: godot-windows
          path: godot/addons/mapcraft/bin/windows
      - run: packaging/godot-addon.sh
      - uses: actions/upload-artifact@v4
        with:
          name: godot-addon
          path: dist/MapCraft-godot-addon.zip

  release:
    needs: [appimage, windows, macos, godot-addon]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{appimage,windows,macos,godot-addon}'
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MapCraft $GITHUB_REF_NAME" --generate-notes
