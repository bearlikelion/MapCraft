name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows-latest]
    # Linux pushes run on the build server; pull requests stay on GitHub's machines, so outside code never runs there.
    runs-on: ${{ matrix.os != 'linux' && matrix.os || github.event_name == 'pull_request' && 'ubuntu-latest' || 'build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Linux packages
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers
      # The build server keeps its target folder between runs, and its software Vulkan crashes on parallel UI tests.
      - name: Build server settings
        if: runner.environment == 'self-hosted'
        run: echo -e "CARGO_TARGET_DIR=/build/ci-cache/target-ci\nRUST_TEST_THREADS=1" >> "$GITHUB_ENV"
      - run: cargo xtask ci

  # macOS runners have no GPU for the offscreen editor tests, so this checks the build, lints and the other tests.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask plugins
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude mapcraft-ui
      - name: Godot extension
        run: brew install ninja && godot/build.sh macos template_debug

  godot:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tools
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the extension
        run: godot/build.sh linux template_debug
      - name: Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import test
        run: godot/test.sh
