[package]
name = "plugin-source-bsp"
description = "Valve Source BSP importer for MapCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { workspace = true }
glam = { workspace = true }
lzma-rust2 = { version = "0.24", default-features = false, features = ["std"] }

[dev-dependencies]
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "encoder"] }
