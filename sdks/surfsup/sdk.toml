id = "surfsup"
name = "SurfsUp"
version = "3"
plugins = ["godot", "source-bsp", "surfsup"]
fgd = ["fgd/surfsup.fgd"]

[textures]
roots = ["${project}/Assets/Textures"]
extensions = ["png", "jpg", "jpeg"]
default = "ramps-orange1"
scale = 1.0

# Imported Source maps read their stock textures from the game's packages; CS:S uses HL2's too.
[files]
roots = ["${cstrike}", "${cstrike}/../hl2"]

[paths.project]
prompt = "SurfsUp Godot project folder"

[paths.godot]
prompt = "Godot editor executable"
kind = "file"

[paths.game]
prompt = "SurfsUp game executable"
kind = "file"

[paths.maps]
prompt = "Folder SurfsUp loads map packs from (Maps next to the game)"

[paths.cstrike]
prompt = "Counter-Strike: Source game folder (the cstrike folder), for textures of imported BSP maps"

# The project needs the MapCraft Godot addon (godot/addons/mapcraft) and must have been opened
# in the Godot editor once so the addon is registered.
[[compile]]
name = "Import into Godot"
steps = [
    { copy = "${map}", to = "${project}/maps/${map_name}/${map_name}.mcmap" },
    { run = "${godot}", args = ["--headless", "--path", "${project}", "--import"] },
]

[[compile]]
name = "Build map pack"
steps = [
    { copy = "${map}", to = "${project}/maps/${map_name}/${map_name}.mcmap" },
    { run = "${godot}", args = ["--headless", "--path", "${project}", "--import"] },
    { run = "${godot}", args = ["--headless", "--path", "${project}", "-s", "res://addons/mapcraft/tools/pack_map.gd", "--", "res://maps/${map_name}/${map_name}.mcmap", "res://maps/${map_name}/${map_name}.scn", "${maps}/${map_name}.pck"] },
]

[[compile]]
name = "Build and play"
steps = [
    { copy = "${map}", to = "${project}/maps/${map_name}/${map_name}.mcmap" },
    { run = "${godot}", args = ["--headless", "--path", "${project}", "--import"] },
    { run = "${godot}", args = ["--headless", "--path", "${project}", "-s", "res://addons/mapcraft/tools/pack_map.gd", "--", "res://maps/${map_name}/${map_name}.mcmap", "res://maps/${map_name}/${map_name}.scn", "${maps}/${map_name}.pck"] },
    { run = "${game}", args = ["+map", "${map_name}"] },
]
