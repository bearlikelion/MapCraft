[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# internal
mapcraft-geom = { path = "crates/geom" }
mapcraft-map = { path = "crates/map" }
mapcraft-fgd = { path = "crates/fgd" }
mapcraft-format = { path = "crates/format" }
mapcraft-sdk = { path = "crates/sdk" }
mapcraft-plugin-host = { path = "crates/plugin-host" }
mapcraft-engine = { path = "crates/engine" }
mapcraft-sdk-manager = { path = "crates/sdk-manager" }
mapcraft-render = { path = "crates/render" }
mapcraft-ui = { path = "crates/ui" }

# craft-libs (MIT OR Apache-2.0), pinned by rev
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8a503cfe79f0a4e7da2e167e01e71155668e0cee" }
craft-docpath = { git = "https://github.com/storytold/craft-libs", rev = "8a503cfe79f0a4e7da2e167e01e71155668e0cee" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "8a503cfe79f0a4e7da2e167e01e71155668e0cee" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "8a503cfe79f0a4e7da2e167e01e71155668e0cee" }

# foundation
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
toml = "1"
log = "0.4"
tempfile = "3"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
gltf-json = { version = "1.4", features = ["names"] }
base64 = "0.22"
fastnoise-lite = "1.1"

# plugins
wasmtime = { version = "50", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "parallel-compilation", "cache"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

# sdk registry: downloads over rustls with the system's certificates
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"

# gpu: the same wgpu egui-wgpu 0.36 uses
wgpu = "30"
naga = "30"
pollster = "0.4"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.mapcraft-geom]
opt-level = 3

[profile.dev.package.mapcraft-render]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
